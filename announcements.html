<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWHC Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-navy: #1B2A4A;
    --navy: #1E3A5F;
    --teal: #32DAD7;
    --teal-deep: #0FB9B1;
    --near-black: #1c2430;
    --slate: #e3e8ef;
    --muted: #7a8699;
    --bg-subtle: #f6f8fb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    background: transparent;
    color: var(--near-black);
    -webkit-font-smoothing: antialiased;
  }
  #wrap { padding: 2px 2px 6px; }
  /* card list */
  #cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    position: relative;
    background: #fff;
    border: 1px solid var(--slate);
    border-radius: 10px;
    padding: 13px 16px 14px;
    box-shadow: 0 1px 2px rgba(27,42,74,.04);
  }
  .card.pinned {
    border-left: 4px solid var(--teal);
    padding-left: 14px;
  }
  .pin-pill {
    position: absolute; top: 11px; right: 13px;
    font-size: 9px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--teal-deep);
    background: rgba(50,218,215,.13);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .card .title {
    font-size: 16px; font-weight: 700; line-height: 1.3;
    color: var(--deep-navy);
    margin: 0 70px 3px 0;
  }
  .card .date {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--teal-deep);
    font-variant-numeric: tabular-nums;
    margin-bottom: 7px;
  }
  .card .body {
    font-size: 13px; font-weight: 400; line-height: 1.5;
    color: var(--near-black);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  /* empty / error */
  #empty {
    display: none;
    text-align: center;
    font-weight: 300;
    font-size: 13px;
    color: var(--muted);
    padding: 26px 10px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="cards" aria-live="polite"></div>
  <div id="empty">No announcements yet.</div>
</div>
<script>
  // Escape helper — body is plain text; never innerHTML it (XSS guard).
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s == null ? '' : String(s));
    return d.innerHTML;
  }
  // Format an ISO/Y-M-D date string into "MON D, YYYY". Falls back to the raw string.
  function fmtDate(s) {
    if (!s) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return String(s);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var y = m[1], mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
    return months[mo - 1] + ' ' + d + ', ' + y;
  }
  function render(items) {
    var cards = document.getElementById('cards');
    var empty = document.getElementById('empty');
    cards.innerHTML = '';
    if (!items || !items.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    // Defensive: pinned-first then keep incoming order (WF already sorts).
    var sorted = items.slice().sort(function (a, b) {
      return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    });
    sorted.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'card' + (it.pinned ? ' pinned' : '');
      var pin = it.pinned ? '<span class="pin-pill">Pinned</span>' : '';
      card.innerHTML =
        pin +
        '<div class="title">' + esc(it.title) + '</div>' +
        '<div class="date">' + esc(fmtDate(it.date)) + '</div>' +
        '<div class="body">' + esc(it.body) + '</div>';
      cards.appendChild(card);
    });
  }
  fetch('https://dev1.mareto.helpseeker.org/api/gateway/awh-announcements?v=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : { items: [] }; })
    .catch(function () { return { items: [] }; })
    .then(function (data) {
      // Accept envelope {items:[...]} or a bare array, defensively.
      var items = data && data.items ? data.items : (Array.isArray(data) ? data : []);
      render(items);
    });
</script>
</body>
</html>
