<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWHC Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-navy: #1B2A4A;
    --navy: #1E3A5F;
    --teal: #32DAD7;
    --teal-deep: #0FB9B1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Lato','Helvetica Neue',Arial,sans-serif; }
  #banner {
    height: 100%;
    min-height: 96px;
    background: linear-gradient(120deg, var(--deep-navy) 0%, var(--navy) 60%, var(--teal-deep) 140%);
    border-left: 5px solid var(--teal);
    border-radius: 10px;
    padding: 20px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  #title {
    font-size: 23px; font-weight: 700; line-height: 1.15;
    letter-spacing: .2px;
  }
  #title .accent { color: var(--teal); }
  #subtitle {
    margin-top: 6px;
    font-size: 13px; font-weight: 400; line-height: 1.45;
    color: #cdd8e6;
    max-width: 920px;
  }
  #caveat {
    margin-top: 7px;
    font-size: 11px; font-weight: 300; font-style: italic;
    color: #8aa0bd;
  }
</style>
</head>
<body>
<div id="banner">
  <div id="title"></div>
  <div id="subtitle"></div>
  <div id="caveat"></div>
</div>
<script>
  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  var title = qp('title') || 'A Way Home Canada';
  var sub = qp('subtitle');
  var caveat = qp('caveat');
  // allow a single teal-accent token: wrap text between ⟦ ⟧ in the teal accent span
  var tEl = document.getElementById('title');
  tEl.innerHTML = esc(title).replace(/&#x27E6;([^&]*?)&#x27E7;/g, '<span class="accent">$1</span>')
                            .replace(/⟦([^⟧]*)⟧/g, '<span class="accent">$1</span>');
  if (sub) document.getElementById('subtitle').textContent = sub;
  if (caveat) document.getElementById('caveat').textContent = caveat;
  document.title = title;
</script>
</body>
</html>
