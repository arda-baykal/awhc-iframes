<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap');
:root{--navy:#0B1F33;--mid:#102A43;--teal:#0FB9B1;--aqua:#4FD1C5;--text:#fff;--soft:#EAF7F6;}
*{box-sizing:border-box} body{margin:0;font-family:Lato,Arial,sans-serif;background:transparent;color:var(--text);}
.header{min-height:150px;padding:24px 28px;background:linear-gradient(135deg,var(--navy),var(--mid) 58%,#0E8C86);border-radius:8px;box-shadow:0 18px 42px rgba(11,31,51,.16);overflow:hidden;}
.top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{margin:0 0 8px;color:var(--aqua);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.title{margin:0 0 8px;font-size:31px;line-height:1.1;font-weight:700}
.title .accent{color:var(--aqua)}
.lead{margin:0;max-width:760px;color:var(--soft);font-size:15px;line-height:1.45;font-weight:300}
.caveat{margin:8px 0 0;color:#9fb6cf;font-size:12px;font-style:italic;font-weight:300}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border-radius:7px;padding:12px 18px;font-size:14px;font-weight:700;line-height:1;white-space:nowrap}
.btn.primary{background:var(--teal);color:#0B1F33;box-shadow:0 6px 16px rgba(50,218,215,.25)}
.btn.primary:hover{background:#4FD1C5}
@media(max-width:720px){.actions{width:100%}.btn{width:100%;justify-content:center}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:10px;margin-top:18px}
.stat{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);border-radius:8px;padding:12px 14px}
.label{display:block;margin-bottom:6px;color:#7EDDD5;font-size:11px;font-weight:700;text-transform:uppercase}
.value{font-size:16px;font-weight:700;color:#fff}
@media(max-width:720px){.header{padding:20px;min-height:0}.title{font-size:25px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="header">
  <div class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="title" id="title"></h1>
      <p class="lead" id="lead"></p>
      <p class="caveat" id="caveat"></p>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="stats" id="stats" style="display:none"></div>
</section>
<script>
  function qp(n){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
  function setText(id,v){var e=document.getElementById(id);if(e){if(v)e.textContent=v;else e.style.display='none';}}
  var eyebrow=qp('eyebrow')||'A Way Home Canada';
  document.getElementById('eyebrow').textContent=eyebrow;
  // title supports a teal-accent token ⟦...⟧
  var title=qp('title')||'A Way Home Canada';
  document.getElementById('title').innerHTML=esc(title).replace(/⟦([^⟧]*)⟧/g,'<span class="accent">$1</span>');
  setText('lead',qp('lead'));
  setText('caveat',qp('caveat'));
  document.title=title;

  // optional CTA button (top-right): ?cta=<url>&ctalabel=<text>
  var cta=qp('cta');
  if(cta){
    var label=qp('ctalabel')||'Open the survey';
    var a=document.createElement('a');
    a.className='btn primary';
    a.href=cta; a.target='_blank'; a.rel='noopener';
    a.textContent=label;
    document.getElementById('actions').appendChild(a);
  }

  // optional live KPI stats: ?kpi=1 -> Survey Responses / Policies Changed / Funding from the impact gateway
  if(qp('kpi')==='1'){
    var box=document.getElementById('stats');
    function card(label,val){return '<div class="stat"><span class="label">'+esc(label)+'</span><span class="value">'+esc(val)+'</span></div>';}
    function dollars(n){return (n==null||isNaN(n))?'—':'$'+Number(n).toLocaleString('en-CA');}
    function num(n){return (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-CA');}
    fetch('https://main.mareto.helpseeker.org/api/gateway/awh-impact-kpi?v='+Date.now())
      .then(function(r){return r.ok?r.json():{};}).catch(function(){return {};})
      .then(function(d){
        box.innerHTML=card('Survey responses',num(d.responses))+card('Policies / practices changed',num(d.policies))+card('Funding attributed',dollars(d.funding));
        box.style.display='grid';
      });
  }
</script>
</body>
</html>
