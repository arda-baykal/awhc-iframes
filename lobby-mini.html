<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Activity — AWHC</title>

<!-- ============================================================
     AWHC Dashboard — Lobby Activity (compact widget for Home block)
     HelpSeeker brand-compliant
     Pre-bake data via lobby-data.json (placeholder values today)
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet">

<style>
  :root {
    --deep-navy:     #0B1F33;
    --midnight:      #102A43;
    --slate:         #1E3A5F;
    --teal:          #0FB9B1;
    --aqua:          #4FD1C5;
    --white:         #FFFFFF;
    --near-black:    #0A0A0A;
    --border:        #E5E7EB;
    --bg-subtle:     #F9FAFB;
    --slate-soft:    #64748B;
    --slate-muted:   #94A3B8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    background: transparent;
    color: var(--near-black);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body { padding: 0; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  .widget {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 26px;
    box-shadow:
      0 1px 3px rgba(11, 31, 51, 0.04),
      0 4px 12px rgba(11, 31, 51, 0.03);
    max-width: 100%;
  }

  /* ===== HEADER ===== */
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .head-text {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .head-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-subtle);
    color: var(--teal);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .head-icon .material-symbols-outlined { font-size: 22px; }
  .head h2 {
    font-weight: 700;
    font-size: 17px;
    color: var(--deep-navy);
    letter-spacing: -0.1px;
    line-height: 1.2;
  }
  .head .sub {
    font-weight: 300;
    font-size: 12px;
    color: var(--slate-soft);
    margin-top: 2px;
  }
  .head a.full-link {
    font-size: 12px;
    font-weight: 700;
    color: var(--teal);
    text-decoration: none;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
    white-space: nowrap;
  }
  .head a.full-link:hover { border-bottom-color: var(--teal); }
  .head a.full-link .material-symbols-outlined { font-size: 14px; }

  /* ===== KPI TILES ===== */
  .kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .kpi.t-teal  { background: rgba(15, 185, 177, 0.06); border-color: rgba(15, 185, 177, 0.20); }
  .kpi.t-aqua  { background: rgba(79, 209, 197, 0.08); border-color: rgba(79, 209, 197, 0.22); }
  .kpi.t-slate { background: rgba(30, 58, 95, 0.05);  border-color: rgba(30, 58, 95, 0.16); }

  .kpi-value {
    font-weight: 700;
    font-size: 28px;
    color: var(--deep-navy);
    line-height: 1.05;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .kpi-label {
    font-weight: 400;
    font-size: 11px;
    margin-top: 4px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .kpi.t-teal  .kpi-label { color: var(--teal); }
  .kpi.t-aqua  .kpi-label { color: #2B9B92; } /* slightly deeper for legibility */
  .kpi.t-slate .kpi-label { color: var(--slate); }

  .kpi-accent {
    display: inline-block;
    width: 22px;
    height: 2px;
    margin-top: 8px;
    border-radius: 1px;
  }
  .kpi.t-teal  .kpi-accent { background: var(--teal); }
  .kpi.t-aqua  .kpi-accent { background: var(--aqua); }
  .kpi.t-slate .kpi-accent { background: var(--slate); }

  /* ===== RECENT LIST ===== */
  .recent-head {
    font-weight: 700;
    font-size: 11px;
    color: var(--slate-muted);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .recent-list { list-style: none; }
  .recent-item {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bg-subtle);
    align-items: baseline;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-date {
    font-weight: 700;
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .recent-event {
    font-weight: 400;
    font-size: 13px;
    color: var(--near-black);
    line-height: 1.4;
  }
  .recent-event .meta {
    display: block;
    font-size: 11px;
    color: var(--slate-soft);
    margin-top: 2px;
    font-weight: 300;
  }

  .empty {
    padding: 20px 0;
    text-align: center;
    color: var(--slate-muted);
    font-size: 12px;
    font-weight: 300;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 560px) {
    .widget { padding: 20px 18px; }
    .head { flex-wrap: wrap; }
    .kpis { gap: 8px; }
    .kpi { padding: 12px 12px; }
    .kpi-value { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="widget">
  <div class="head">
    <div class="head-text">
      <div class="head-icon"><span class="material-symbols-outlined">gavel</span></div>
      <div>
        <h2>Lobby Activity</h2>
        <div class="sub">Federally reportable lobbying communications</div>
      </div>
    </div>
    <a href="https://main.mareto.helpseeker.org/compose/ns/AWHCanada/page/494394316987432961" target="_top" class="full-link">
      Full register
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
  </div>

  <div class="kpis">
    <div class="kpi t-teal">
      <div class="kpi-value" id="kpi-ytd">&mdash;</div>
      <div class="kpi-label">Year to date</div>
      <span class="kpi-accent"></span>
    </div>
    <div class="kpi t-aqua">
      <div class="kpi-value" id="kpi-quarter">&mdash;</div>
      <div class="kpi-label">This quarter</div>
      <span class="kpi-accent"></span>
    </div>
    <div class="kpi t-slate">
      <div class="kpi-value" id="kpi-30d">&mdash;</div>
      <div class="kpi-label">Last 30 days</div>
      <span class="kpi-accent"></span>
    </div>
  </div>

  <div class="recent-head">Recent activity</div>
  <ul class="recent-list" id="recent-list">
    <li class="empty">Loading&hellip;</li>
  </ul>
</div>

<script>
(function() {
  // Pull live data from co-hosted lobby-data.json
  // Falls back to placeholder structure if not present
  fetch('./lobby-data.json?v=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(data => render(data || placeholder()))
    .catch(() => render(placeholder()));

  function placeholder() {
    return {
      ytd: 0,
      quarter: 0,
      last30d: 0,
      recent: []
    };
  }

  function render(d) {
    document.getElementById('kpi-ytd').textContent = d.ytd ?? '—';
    document.getElementById('kpi-quarter').textContent = d.quarter ?? '—';
    document.getElementById('kpi-30d').textContent = d.last30d ?? '—';

    const ul = document.getElementById('recent-list');
    ul.innerHTML = '';
    const items = Array.isArray(d.recent) ? d.recent.slice(0, 5) : [];

    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No reportable events on record yet.';
      ul.appendChild(li);
      return;
    }

    items.forEach(it => {
      const li = document.createElement('li');
      li.className = 'recent-item';
      const dateEl = document.createElement('div');
      dateEl.className = 'recent-date';
      dateEl.textContent = formatDate(it.date);
      const evEl = document.createElement('div');
      evEl.className = 'recent-event';
      const nameText = document.createTextNode(it.name || 'Untitled event');
      evEl.appendChild(nameText);
      if (it.meta) {
        const span = document.createElement('span');
        span.className = 'meta';
        span.textContent = it.meta;
        evEl.appendChild(span);
      }
      li.appendChild(dateEl);
      li.appendChild(evEl);
      ul.appendChild(li);
    });
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }
})();
</script>

</body>
</html>
