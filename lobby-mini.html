<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby Activity — AWHC</title>

<!-- ============================================================
     AWHC Dashboard — Lobby Activity widget (Home page IFrame block)
     v2: glossary-style hero banner + color-varied KPI tiles
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet">

<style>
  :root {
    --deep-navy:     #0B1F33;
    --midnight:      #102A43;
    --slate:         #1E3A5F;
    --teal:          #0FB9B1;
    --aqua:          #4FD1C5;
    --white:         #FFFFFF;
    --near-black:    #0A0A0A;
    --border:        #E5E7EB;
    --border-2:      #E8EDF2;
    --bg-subtle:     #F9FAFB;
    --slate-soft:    #64748B;
    --slate-muted:   #94A3B8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    background: transparent;
    color: var(--near-black);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { padding: 0; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  .widget {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 1px 3px rgba(11, 31, 51, 0.04),
      0 4px 12px rgba(11, 31, 51, 0.03);
  }

  /* ===== HERO BANNER (glossary-style) ===== */
  .hero {
    background: linear-gradient(to right, var(--deep-navy), var(--slate));
    color: var(--white);
    padding: 28px 32px 26px 32px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: -40%;
    right: -8%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, var(--teal) 0%, transparent 60%);
    opacity: 0.18;
    pointer-events: none;
  }
  .hero-text {
    z-index: 1;
    position: relative;
    max-width: 70%;
  }
  .hero-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--aqua);
    margin-bottom: 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .hero-eyebrow .material-symbols-outlined { font-size: 16px; }
  .hero h1 {
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.4px;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .hero .subtitle {
    font-weight: 300;
    font-size: 13px;
    opacity: 0.85;
    max-width: 480px;
    line-height: 1.45;
  }
  .hero a.full-link {
    z-index: 1;
    position: relative;
    font-size: 11px;
    font-weight: 700;
    color: var(--white);
    text-decoration: none;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 6px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .hero a.full-link:hover {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.55);
  }
  .hero a.full-link .material-symbols-outlined { font-size: 13px; }

  /* ===== BODY ===== */
  .body {
    padding: 22px 26px 24px 26px;
  }

  /* ===== KPI TILES ===== */
  .kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .kpi {
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
  }
  .kpi.t-teal  { background: rgba(15, 185, 177, 0.07); border-color: rgba(15, 185, 177, 0.22); }
  .kpi.t-aqua  { background: rgba(79, 209, 197, 0.10); border-color: rgba(79, 209, 197, 0.26); }
  .kpi.t-slate { background: rgba(30, 58, 95, 0.06);   border-color: rgba(30, 58, 95, 0.18); }

  .kpi-value {
    font-weight: 700;
    font-size: 28px;
    color: var(--deep-navy);
    line-height: 1.05;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .kpi-label {
    font-weight: 700;
    font-size: 11px;
    margin-top: 4px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .kpi.t-teal  .kpi-label { color: var(--teal); }
  .kpi.t-aqua  .kpi-label { color: #2B9B92; }
  .kpi.t-slate .kpi-label { color: var(--slate); }

  .kpi-accent {
    display: inline-block;
    width: 22px;
    height: 2px;
    margin-top: 8px;
    border-radius: 1px;
  }
  .kpi.t-teal  .kpi-accent { background: var(--teal); }
  .kpi.t-aqua  .kpi-accent { background: var(--aqua); }
  .kpi.t-slate .kpi-accent { background: var(--slate); }

  /* ===== RECENT LIST ===== */
  .recent-head {
    font-weight: 700;
    font-size: 11px;
    color: var(--slate-muted);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-2);
  }
  .recent-list { list-style: none; }
  .recent-item {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bg-subtle);
    align-items: baseline;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-date {
    font-weight: 700;
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .recent-event {
    font-weight: 400;
    font-size: 13px;
    color: var(--near-black);
    line-height: 1.4;
  }
  .recent-event .meta {
    display: block;
    font-size: 11px;
    color: var(--slate-soft);
    margin-top: 2px;
    font-weight: 300;
  }
  .empty {
    padding: 20px 0;
    text-align: center;
    color: var(--slate-muted);
    font-size: 12px;
    font-weight: 300;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 620px) {
    .hero { flex-direction: column; align-items: flex-start; padding: 22px 22px; }
    .hero-text { max-width: 100%; }
    .hero h1 { font-size: 20px; }
    .body { padding: 18px 20px 20px 20px; }
    .kpis { gap: 8px; }
    .kpi { padding: 12px 12px; }
    .kpi-value { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="widget">

  <!-- ===== HERO ===== -->
  <header class="hero">
    <div class="hero-text">
      <div class="hero-eyebrow">
        <span class="material-symbols-outlined">gavel</span>
        Live snapshot
      </div>
      <h1>Lobby Activity</h1>
      <p class="subtitle">Federally reportable lobbying communications, refreshed from your Mareto events.</p>
    </div>
    <a href="https://main.mareto.helpseeker.org/compose/ns/AWHCanada/pages/lobby_reportable_events" target="_blank" rel="noopener noreferrer" class="full-link">
      Full register
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
  </header>

  <!-- ===== BODY ===== -->
  <div class="body">

    <div class="kpis">
      <div class="kpi t-teal">
        <div class="kpi-value" id="kpi-ytd">&mdash;</div>
        <div class="kpi-label">Year to date</div>
        <span class="kpi-accent"></span>
      </div>
      <div class="kpi t-aqua">
        <div class="kpi-value" id="kpi-quarter">&mdash;</div>
        <div class="kpi-label">This quarter</div>
        <span class="kpi-accent"></span>
      </div>
      <div class="kpi t-slate">
        <div class="kpi-value" id="kpi-30d">&mdash;</div>
        <div class="kpi-label">Last 30 days</div>
        <span class="kpi-accent"></span>
      </div>
    </div>

    <div class="recent-head">Recent activity</div>
    <ul class="recent-list" id="recent-list">
      <li class="empty">Loading&hellip;</li>
    </ul>

  </div>
</div>

<script>
(function() {
  fetch('./lobby-data.json?v=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(data => render(data || placeholder()))
    .catch(() => render(placeholder()));

  function placeholder() { return { ytd: 0, quarter: 0, last30d: 0, recent: [] }; }

  function render(d) {
    document.getElementById('kpi-ytd').textContent = d.ytd ?? '—';
    document.getElementById('kpi-quarter').textContent = d.quarter ?? '—';
    document.getElementById('kpi-30d').textContent = d.last30d ?? '—';

    const ul = document.getElementById('recent-list');
    ul.innerHTML = '';
    const items = Array.isArray(d.recent) ? d.recent.slice(0, 5) : [];
    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No reportable events on record yet.';
      ul.appendChild(li);
      return;
    }
    items.forEach(it => {
      const li = document.createElement('li');
      li.className = 'recent-item';
      const dateEl = document.createElement('div');
      dateEl.className = 'recent-date';
      dateEl.textContent = formatDate(it.date);
      const evEl = document.createElement('div');
      evEl.className = 'recent-event';
      evEl.appendChild(document.createTextNode(it.name || 'Untitled event'));
      if (it.meta) {
        const span = document.createElement('span');
        span.className = 'meta';
        span.textContent = it.meta;
        evEl.appendChild(span);
      }
      li.appendChild(dateEl);
      li.appendChild(evEl);
      ul.appendChild(li);
    });
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }
})();
</script>

</body>
</html>
